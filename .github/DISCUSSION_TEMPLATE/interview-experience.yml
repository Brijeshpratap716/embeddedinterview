title: "[Company] Role - Interview experience"
labels: ["interview-experience"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Your post appears on **embeddedinterview.com/forum** within a few minutes.
        Please **do not share confidential or NDA-protected material** such as exact take-home tasks or internal code. Describe topics and the kind of questions instead.
  - type: input
    id: company
    attributes:
      label: Company
      placeholder: e.g. Qualcomm, NXP, Bosch, Texas Instruments
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role
      placeholder: e.g. Embedded Software Engineer, Linux BSP Engineer, Firmware Intern
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: e.g. Bangalore, Munich, Remote
  - type: dropdown
    id: experience
    attributes:
      label: Experience level
      options:
        - Intern / Fresher
        - 1-3 years
        - 3-6 years
        - 6-10 years
        - 10+ years
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Offer
        - Rejected
        - Pending
        - Withdrew
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true
  - type: textarea
    id: rounds
    attributes:
      label: Rounds and questions
      description: What happened in each round, and which topics and questions came up?
      placeholder: |
        Round 1 (online test, 60 min): C output questions, bit manipulation...
        Round 2 (technical): volatile, ISR rules, I2C vs SPI, write a ring buffer...
        Round 3 (manager): project deep dive...
    validations:
      required: true
  - type: textarea
    id: tips
    attributes:
      label: Tips for others
      placeholder: What would you prepare differently?
  - type: checkboxes
    id: nda
    attributes:
      label: Confirmation
      options:
        - label: This post contains no confidential or NDA-protected information.
          required: true
